services:
  - type: web
    name: chessbookreader-cv-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-ocr.txt && python download_ocr_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
